setw -g mouse on
setw -g mode-keys vi

unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

bind-key -n C-S-Left swap-window -t -1
bind-key -n C-S-Right swap-window -t +1

# yassifying tmux
# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=black bg=red bold'

# panes
set -g pane-border-style 'fg=red'
set -g pane-active-border-style 'fg=yellow'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left ''
set -g status-left-length 10

set -g status-right-style 'fg=black bg=yellow'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=red'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=red bg=black'
setw -g window-status-format ' #I #[fg=white]#W #[fg=yellow]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

# end of yassifying


# don't rename windows automatically
# set-option -g allow-rename off

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# Send a command to every window in the current session.
# Usage from tmux prompt: send-all-windows pc
set -g @send_all_windows 'tmux list-windows -F '''#I''' | while read -r w; do tmux send-keys -t ":$w" "$1" Enter; done'

# Prompt for text and send it + Enter to every window in the current session.
# Usage: prefix A, type text, Enter
bind-key A command-prompt -p 'send to all windows:' 'run-shell "~/.pi/tmp/tmux-send-all-windows \"%%\""'

run '~/.tmux/plugins/tpm/tpm'
